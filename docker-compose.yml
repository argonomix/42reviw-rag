services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reviewrag
      POSTGRES_PASSWORD: reviewrag
      POSTGRES_DB: reviewrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewrag -d reviewrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://reviewrag:reviewrag@postgres:5432/reviewrag
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      EMBEDDING_BACKEND: deterministic
      SEED_DATA_PATH: data/seed/reviews.json
      EVAL_DATA_PATH: data/eval/questions.json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
